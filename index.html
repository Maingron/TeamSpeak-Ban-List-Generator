<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="Generate Regex Ban lists for your TeamSpeak Server that you can import with YaTQA">
		<meta name="keywords" content="teamspeak, ts3 regex, banlist, generator, regex, yatqa, ts3, ts3server, ts3admin, ts3query, ts3queryadmin, ts3queryclient, ts3queryserver, ts3queryban, ts3querybanentry, ts3queryclientdb, ts3queryclientdbentry, ts3queryservergroup, ts3queryservergroupentry">
		<meta name="author" content="Maingron">
		<meta content="index, follow" name="robots">
		<link rel="canonical" href="https://maingron.github.io/TeamSpeak-Ban-List-Generator/">
		<title>Maingrons TeamSpeak Banlist generator</title>
		<link rel="shortcut icon" href="logo.svg" type="image/svg+xml">
		<link rel="stylesheet" type="text/css" href="css/style.min.css">
		<meta property="og:title" content="Maingrons TeamSpeak Banlist generator">
		<meta property="og:description" content="Generate Regex Ban lists for your TeamSpeak Server that you can import with YaTQA">
		<meta property="og:image" content="https://maingron.github.io/TeamSpeak-Ban-List-Generator/logo.svg">
		<meta property="og:url" content="https://maingron.github.io/TeamSpeak-Ban-List-Generator/">
		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:title" content="Maingrons TeamSpeak Banlist generator">
		<meta name="twitter:description" content="Generate Regex Ban lists for your TeamSpeak Server that you can import with YaTQA">
		<meta name="twitter:image" content="https://maingron.github.io/TeamSpeak-Ban-List-Generator/logo.svg">
	</head>
	<body>
		<div class="bg-image"></div>
		<div>
			<p class="info-note"><strong>Note:</strong> For full functionality, please read the <a href="https://github.com/Maingron/TeamSpeak-Ban-List-Generator#readme" target="_blank" rel="noopener">README</a> and use your browser console (Ctrl+Shift+I).</p>
			<section class="section-tester">
				<h2>Tester </h2>
				<input class="match-tester" type="text" placeholder="Match Tester" oninput="matchTester(this.value, allBanEntries)">
				<textarea name="match-tester--matches" class="match-tester--matches" rows="5" placeholder="Matching matches will be displayed here" readonly></textarea>
			</section>

			<section class="section-output">
				<h2>Generated Yatqa Ban List </h2>
				<textarea name="g-ybl" id="g-ybl" readonly></textarea>
				<table></table>
			</section>
		</div>

		<footer>
			<span>A Maingron Project</span>
			<span>
				<a href="https://github.com/Maingron/TeamSpeak-Ban-List-Generator" target="_blank">GitHub Project</a>
			</span>
			<span>
				<a href="https://github.com/Maingron?tab=repositories" target="_blank">GitHub</a>
				|
				<a href="https://maingron.com" target="_blank">Maingron.com</a>
			</span>
		</footer>

		<script>
			let allBanEntries = [];
		</script>
		<script src="matchTester.js"></script>
		<script src="createTableEntry.js"></script>
		<script src="input.js"></script>
		<script src="generateCharsetBan.js"></script>
		<script src="yatqaConverter.js"></script>
		<script src="generator.js"></script>
	</body>
</html>
